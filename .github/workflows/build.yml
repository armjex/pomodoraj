name: Build Windows EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Позволяет запускать вручную

jobs:
  build:
    runs-on: windows-latest  # Windows обязателен для WinForms [citation:9]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore PomodoroTimer.csproj

    - name: Build
      run: dotnet build PomodoroTimer.csproj --configuration Release --no-restore

    - name: Publish single-file EXE
      run: >
        dotnet publish PomodoroTimer.csproj
        -c Release
        -r win-x64
        --self-contained true
        -p:PublishSingleFile=true
        -p:PublishTrimmed=false
        -o ./publish
      # PublishTrimmed=false обязателен для WinForms [citation:7]

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: PomodoroTimer-EXE
        path: ./publish/PomodoroTimer.exe
